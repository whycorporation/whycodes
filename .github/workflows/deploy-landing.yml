# Landing production deploys run on this repo's Linux runner.
# Triggered by workflow_dispatch, repository_dispatch, tagged-release
# dispatch from release.yml, and pushes that change the install scripts.
# Never pull_request.
name: Deploy landing

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-landing]
  # Snapshot fallback on why.codes/install is baked at deploy. Request-time
  # fetch already prefers GitHub raw; this keeps the snapshot from going stale
  # when the installer itself changes without a tagged release.
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/deploy-landing.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Workers
    if: github.repository == 'whycorporation/whycodes'
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout landing
        uses: actions/checkout@v7
        with:
          repository: whycorporation/whycodes-landing
          token: ${{ secrets.LANDING_GITHUB_TOKEN }}
          path: landing

      # Self-hosted runner ships a broken bundled Node 24 `npm` (externals/node24:
      # Cannot find module '../lib/cli.js'). pnpm/action-setup's default installer
      # shells out to that npm. `standalone: true` downloads @pnpm/exe and skips it.
      # Keep this *before* setup-node so `cache: pnpm` finds pnpm on PATH.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # Match landing/package.json "packageManager" (do not also pin version).
          package_json_file: landing/package.json
          standalone: true

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Test GitHub snapshot
        run: pnpm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm deploy
