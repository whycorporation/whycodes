# Landing production deploys run on this repo's Linux runner.
# Triggered by workflow_dispatch, repository_dispatch, tagged-release
# dispatch from release.yml, and pushes that change the install scripts.
# Never pull_request.
name: Deploy landing

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-landing]
  # Snapshot fallback on why.codes/install is baked at deploy. Request-time
  # fetch already prefers GitHub raw; this keeps the snapshot from going stale
  # when the installer itself changes without a tagged release.
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/deploy-landing.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Workers
    if: github.repository == 'whycorporation/whycodes'
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout landing
        uses: actions/checkout@v7
        with:
          repository: whycorporation/whycodes-landing
          token: ${{ secrets.LANDING_GITHUB_TOKEN }}
          path: landing

      # Self-hosted runner ships a broken bundled Node 24 `npm` (externals/node24:
      # Cannot find module '../lib/cli.js'). pnpm/action-setup@v6 always bootstraps
      # with `npm ci` — even `standalone: true` — so it cannot run on this host.
      # Official Node from setup-node includes corepack; that installs pnpm from
      # landing/package.json `packageManager` without touching PATH npm.
      # Do not set `cache: pnpm` here: pnpm is not on PATH yet.
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Install dependencies
        run: pnpm install

      - name: Test GitHub snapshot
        run: pnpm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm deploy
