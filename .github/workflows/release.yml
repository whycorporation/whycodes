name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    if: github.repository == 'whycorporation/whycodes'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux on self-hosted (no GitHub-hosted minutes).
          - target: x86_64-unknown-linux-gnu
            runner: self-hosted
          # Apple/Windows still need GitHub-hosted (or extra self-hosted runners).
          - target: aarch64-apple-darwin
            runner: macos-latest
            macosx_deployment_target: "11.0"
          - target: x86_64-apple-darwin
            runner: macos-latest
            macosx_deployment_target: "10.15"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          # Homebrew bottles/prebuilts should not require the latest macOS SDK.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: cargo build --release --locked -p whycodes-cli --target ${{ matrix.target }}

      # One archive per target, named so the installers can construct the URL
      # from `uname`/`$PROCESSOR_ARCHITECTURE` without consulting an index.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/whycodes" dist/
          cp LICENSE README.md dist/
          tar -C dist -czf "whycodes-${{ matrix.target }}.tar.gz" whycodes LICENSE README.md

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/whycodes.exe" dist/
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "whycodes-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: whycodes-${{ matrix.target }}
          path: |
            whycodes-${{ matrix.target }}.tar.gz
            whycodes-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.repository == 'whycorporation/whycodes'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Checksums are what the installers verify against, so they are generated
      # here rather than per-target: one file, one place, covering everything
      # that is actually being published.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum whycodes-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI is required on the self-hosted runner for release publish" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/whycodes-* artifacts/SHA256SUMS

  # Derived from the just-published SHA256SUMS. Lives on main (the tap default
  # branch), not on the tag — users `brew install whycodes` against main.
  homebrew:
    name: Homebrew formula
    needs: publish
    if: github.repository == 'whycorporation/whycodes'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Bump formula
        env:
          GH_TOKEN: ${{ github.token }}
          WHYCODES_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # `sh` so a missing git +x bit cannot 126 the job (v0.2.0).
          sh scripts/update_homebrew_formula.sh "$TAG"
          git add Formula/whycodes.rb
          if git diff --cached --quiet; then
            echo "Formula already matches $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(homebrew): bump formula to ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
