name: Release

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p whycode-cli --target ${{ matrix.target }}

      # One archive per target, named so the installers can construct the URL
      # from `uname`/`$PROCESSOR_ARCHITECTURE` without consulting an index.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/whycode" dist/
          cp LICENSE README.md dist/
          tar -C dist -czf "whycode-${{ matrix.target }}.tar.gz" whycode LICENSE README.md

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/whycode.exe" dist/
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "whycode-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: whycode-${{ matrix.target }}
          path: |
            whycode-${{ matrix.target }}.tar.gz
            whycode-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Checksums are what the installers verify against, so they are generated
      # here rather than per-target: one file, one place, covering everything
      # that is actually being published.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum whycode-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/whycode-* artifacts/SHA256SUMS
