name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Linux on self-hosted (no GitHub-hosted minutes).
# Job-level `if` cannot use `matrix` — multi-OS is a separate optional job set.
# When minutes are available, set repo variable CI_MULTI_OS=true to also run
# test-multi / build-multi on windows-latest and macos-latest.
jobs:
  check:
    name: Check & Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budgets:
    name: Budgets
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Panic budget
        run: python scripts/check_panic_budget.py
      - name: Swallowed error budget
        run: python scripts/check_swallowed_error_budget.py
      - name: Dependency boundaries
        run: python scripts/check_dependency_boundaries.py
      - name: Bench ceilings (optional JSON)
        run: python scripts/check_bench_ceilings.py
      - name: SDK protocol v1 (Rust ↔ TypeScript)
        run: python scripts/check_sdk_protocol.py

      # The installers are the first thing a new user runs and are not covered
      # by cargo. A syntax error in them is invisible until someone pipes one
      # into a shell.
      - name: Installer syntax (sh)
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/update_homebrew_formula.sh
          sh -n scripts/tui_term_matrix.sh
          sh scripts/test_update_homebrew_formula.sh
          sh scripts/test_tui_term_matrix.sh
      - name: Installer syntax (PowerShell)
        # Self-hosted Linux often has no pwsh; skip rather than fail CI.
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not installed; skipping installer.ps1 syntax check"
            exit 0
          fi
          pwsh -NoProfile -Command '
            $failed = $false
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "$file : $($errors[0].Message)"
                $failed = $true
              }
            }
            if ($failed) { exit 1 }
            Write-Host "installer syntax: ok"
          '

  sdk-ts:
    name: TypeScript SDK
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build and test
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test

  test:
    name: Test (linux)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  coverage:
    name: Coverage (line floor)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Ratchet: workspace line coverage must stay above the floor.
      # `--ignore-filename-regex`: rustc sysroot (e.g. thread_local) leaks into
      # llvm-cov totals on Arch/system toolchains and is not our code.
      # `--skip tests::watcher_picks_up_changes`: notify-timing flake under
      # instrumentation (see crates/index) — it still runs in the `test` job.
      # `--skip picker_flow_over_real_index`: nucleo tick/notify miss under
      # llvm-cov load (see docs/knowhow.md) — Test job still runs it.
      - name: Measure coverage
        run: |
          IGNORE='/usr/src/|/rustc-'
          # 100% crates: ignore *tests.rs (llvm-cov prints the basename)
          # so host-only test branches cannot sink the floor.
          CRATE_IGNORE="$IGNORE|tests\\.rs$"
          cargo llvm-cov --workspace --ignore-filename-regex "$IGNORE" --fail-under-lines 78 --summary-only -- --skip tests::watcher_picks_up_changes --skip picker_flow_over_real_index
          for crate in whycode-function whycode-schema whycode-skill whycode-sandbox whycode-protocol whycode-plugin whycode-command-risk whycode-storage whycode-core whycode-config whycode-format whycode-index; do
            cargo llvm-cov -p "$crate" --ignore-filename-regex "$CRATE_IGNORE" --fail-under-lines 100 --show-missing-lines --summary-only
          done

  build:
    name: Build (linux)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: whycode-linux
          path: target/release/whycode*
          retention-days: 3

  # Optional GitHub-hosted multi-OS (uses billed minutes).
  test-multi:
    name: Test (${{ matrix.os }})
    if: vars.CI_MULTI_OS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  build-multi:
    name: Build (${{ matrix.os }})
    if: vars.CI_MULTI_OS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: whycode-${{ matrix.os }}
          path: target/release/whycode*
          retention-days: 3
