name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Linux jobs run on the repo's self-hosted runner (no GitHub-hosted minutes).
# Windows/macOS matrix is off by default so exhausted GH minutes don't block CI.
# Re-enable via repository variable CI_MULTI_OS=true when minutes are available.
jobs:
  check:
    name: Check & Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budgets:
    name: Budgets
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Panic budget
        run: python scripts/check_panic_budget.py
      - name: Swallowed error budget
        run: python scripts/check_swallowed_error_budget.py
      - name: Dependency boundaries
        run: python scripts/check_dependency_boundaries.py
      - name: Bench ceilings (optional JSON)
        run: python scripts/check_bench_ceilings.py

      # The installers are the first thing a new user runs and are not covered
      # by cargo. A syntax error in them is invisible until someone pipes one
      # into a shell.
      - name: Installer syntax (sh)
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
      - name: Installer syntax (PowerShell)
        # Self-hosted Linux often has no pwsh; skip rather than fail CI.
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not installed; skipping installer.ps1 syntax check"
            exit 0
          fi
          pwsh -NoProfile -Command '
            $failed = $false
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "$file : $($errors[0].Message)"
                $failed = $true
              }
            }
            if ($failed) { exit 1 }
            Write-Host "installer syntax: ok"
          '

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: self-hosted
          # GitHub-hosted multi-OS (uses billed minutes). Off unless CI_MULTI_OS=true.
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
    # Always run Linux (self-hosted). Win/mac only when multi-OS is enabled.
    if: >-
      matrix.name == 'linux' ||
      vars.CI_MULTI_OS == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux
            runner: self-hosted
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
    if: >-
      matrix.name == 'linux' ||
      vars.CI_MULTI_OS == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: whycode-${{ matrix.name }}
          path: target/release/whycode*
