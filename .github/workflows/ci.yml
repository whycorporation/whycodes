name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'landing/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'landing/**'

env:
  CARGO_TERM_COLOR: always

# One pipeline per PR / branch. The repo has a single self-hosted Linux runner;
# without this, every push to main queues 7 jobs behind the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Linux jobs run on the repo's self-hosted runner (no GitHub-hosted minutes).
# Fork pull requests never do: untrusted workflow + checkout on that machine
# is a takeover. Same-repo PRs and pushes to main still run here.
# Job-level `if` cannot use `matrix` — multi-OS is a separate optional job set
# on GitHub-hosted runners (set repo variable CI_MULTI_OS=true).
#
# `github.event.pull_request.head.repo.full_name` is empty on push, so the
# first clause keeps those jobs.
jobs:
  lint:
    name: Lint & Budgets
    runs-on: self-hosted
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Panic budget
        run: python scripts/check_panic_budget.py
      - name: Swallowed error budget
        run: python scripts/check_swallowed_error_budget.py
      - name: Dependency boundaries
        run: python scripts/check_dependency_boundaries.py
      - name: Bench ceilings (optional JSON)
        run: python scripts/check_bench_ceilings.py
      - name: SDK protocol v1 (Rust ↔ TypeScript)
        run: python scripts/check_sdk_protocol.py
      - name: Tracked secrets / scratch
        run: python scripts/check_tracked_secrets.py
      # Installers are not covered by cargo — syntax errors are invisible until piped into a shell.
      - name: Installer syntax (sh)
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
          sh -n scripts/update_homebrew_formula.sh
          test -x scripts/update_homebrew_formula.sh
          sh -n scripts/tui_term_matrix.sh
          sh -n scripts/pre-push
          sh -n scripts/install_git_hooks.sh
          sh scripts/test_update_homebrew_formula.sh
          sh scripts/test_tui_term_matrix.sh
          sh scripts/test_pre_push.sh
          python scripts/test_tracked_secrets.py
          python scripts/test_release_downloads.py
      - name: Installer syntax (PowerShell)
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "pwsh not installed; skipping installer.ps1 syntax check"
            exit 0
          fi
          pwsh -NoProfile -Command '
            $failed = $false
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1")) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "$file : $($errors[0].Message)"
                $failed = $true
              }
            }
            if ($failed) { exit 1 }
            Write-Host "installer syntax: ok"
          '
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: TypeScript SDK — build and test (merged from sdk-ts to save checkout/cache on single runner)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test

  test:
    name: Test (linux)
    runs-on: self-hosted
    timeout-minutes: 12
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  coverage:
    name: Coverage (line floor)
    runs-on: self-hosted
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Ratchet: workspace floor 82; per-crate 100% (--ignore-filename-regex skips rustc sysroot).
      # --skip: notify flake under instrumentation (see crates/index) — still runs in `test` job.
      - name: Measure coverage
        run: |
          IGNORE='/usr/src/|/rustc-'
          CRATE_IGNORE="$IGNORE|tests\\.rs$"
          cargo llvm-cov --workspace --ignore-filename-regex "$IGNORE" --fail-under-lines 82 --summary-only -- --skip tests::watcher_picks_up_changes --skip picker_flow_over_real_index
          for crate in whycodes-function whycodes-schema whycodes-skill whycodes-sandbox whycodes-protocol whycodes-plugin whycodes-command-risk whycodes-storage whycodes-core whycodes-config whycodes-index; do
            cargo llvm-cov -p "$crate" --ignore-filename-regex "$CRATE_IGNORE" --fail-under-lines 100 --show-missing-lines --summary-only
          done
          cargo llvm-cov -p whycodes-format --ignore-filename-regex "$CRATE_IGNORE" --fail-under-lines 95 --show-missing-lines --summary-only

  build:
    name: Build (linux)
    runs-on: self-hosted
    timeout-minutes: 15
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: whycodes-linux
          path: target/release/whycodes*
          retention-days: 3

  # Public forks never reach the self-hosted jobs above. This GitHub-hosted
  # no-op keeps a green check and tells the author why Linux CI did not run.
  fork-notice:
    name: Fork PRs skip self-hosted CI
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain
        run: |
          echo "Fork pull requests do not run on the project's self-hosted runner."
          echo "A maintainer reviews the diff and runs CI from a same-repo branch."

  # Optional GitHub-hosted multi-OS (uses billed minutes).
  test-multi:
    name: Test (${{ matrix.os }})
    if: vars.CI_MULTI_OS == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  build-multi:
    name: Build (${{ matrix.os }})
    if: vars.CI_MULTI_OS == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: whycodes-${{ matrix.os }}
          path: target/release/whycodes*
          retention-days: 3
