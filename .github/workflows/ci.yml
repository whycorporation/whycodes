name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budgets:
    name: Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Panic budget
        run: python scripts/check_panic_budget.py
      - name: Swallowed error budget
        run: python scripts/check_swallowed_error_budget.py
      - name: Dependency boundaries
        run: python scripts/check_dependency_boundaries.py

      # The installers are the first thing a new user runs and are not covered
      # by cargo. A syntax error in them is invisible until someone pipes one
      # into a shell.
      - name: Installer syntax (sh)
        run: |
          sh -n scripts/install.sh
          sh -n scripts/uninstall.sh
      - name: Installer syntax (PowerShell)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  Write-Host "$file : $($errors[0].Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
          Write-Host "installer syntax: ok"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: whycode-${{ matrix.os }}
          path: target/release/whycode*
