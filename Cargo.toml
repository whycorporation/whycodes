[workspace]
members = [
    "crates/core",
    "crates/llm",
    "crates/tools",
    "crates/session",
    "crates/agent",
    "crates/cli",
    "crates/mcp",
    "crates/skill",
]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/whycorporation/whycode"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
reqwest-eventsource = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Config
directories = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Async streams
futures = "0.3"
async-stream = "0.3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# AI SDK
async-openai = "0.27"

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# File watching
notify = { version = "7", features = ["macos_kqueue"] }

# Regex (for grep tool)
regex = "1"

# Glob pattern matching
glob = "0.3"

# Terminal colors
colored = "2"

# Base64
base64 = "0.22"

# Testing
tempfile = "3"
