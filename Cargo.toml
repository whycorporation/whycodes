[workspace]
members = [
    "crates/core",
    "crates/auth",
    "crates/config",
    "crates/llm",
    "crates/tools",
    "crates/session",
    "crates/agent",
    "crates/cli",
    "crates/tui",
    "crates/mcp",
    "crates/skill",
    "crates/storage",
    "crates/format",
    "crates/lsp",
    "crates/server",
    "crates/protocol",
    "crates/schema",
    "crates/sdk",
    "crates/function",
    "crates/plugin",
    "crates/command-risk",
    "crates/sandbox",
    "crates/memory",
    "crates/index",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/whycorporation/whycodes"

[workspace.dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
reqwest-eventsource = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry", "std"] }
thiserror = "2"
anyhow = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
futures = "0.3"
async-stream = "0.3"
ratatui = "0.29"
crossterm = "0.28"
async-openai = "0.27"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = { version = "7", features = ["macos_kqueue"] }
regex = "1"
glob = "0.3"
colored = "2"
base64 = "0.22"
tempfile = "3"
# Fast non-cryptographic hashing for trusted internal maps and memo keys.
# Do not use for integrity (upgrade SHA-256 stays on sha2).
rustc-hash = "2"
# ripgrep's directory walker: gitignore-aware, parallel. Backs whycodes-index.
ignore = "0.4"
# ripgrep's in-process searcher (mmap, SIMD, binary detection). Backs the grep tool.
grep-searcher = "0.1"
grep-regex = "0.1"
rayon = "1"
# helix/fzf-grade fuzzy matcher with background worker threads. Backs the
# TUI file picker in whycodes-index.
nucleo = "0.5"

# Release: smallest ship binary + hot-path inlining (format, risk, TUI).
# full LTO (was thin) + panic=abort cuts page-in for Boot/TTFF (`--version`).
# Link is slower; use `cargo build -p whycodes-cli` for day-to-day, not full release.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
