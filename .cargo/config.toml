# Build speed: sccache caches the C/C++ part of `rusqlite/bundled` and `ring`
# (~43s cold). If installed, export RUSTC_WRAPPER=sccache (or set
# `build.rustc-wrapper = "sccache"` below). Install: `paru -S sccache`
# or `cargo install sccache`. `mold` speeds up linking of the final
# `whycodes` binary (~30%); install `mold` and add `-fuse-ld=mold` to
# RUSTFLAGS if you want it.
# Uncomment to force sccache when it exists (fails if not installed):
# [build]
# rustc-wrapper = "sccache"

# Boot/TTFF: full RELRO (BIND_NOW) resolves every dynamic relocation before
# `main`, paging in large chunks of a 10+ MB binary for `whycodes --version`.
# Partial RELRO keeps the GOT hardened without BIND_NOW so the floor path only
# faults pages it actually runs. Linux ELF only; other targets ignore this.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "relro-level=partial"]

# Windows start-up: link the C runtime statically. A dynamic CRT loads
# VCRUNTIME140 plus nine api-ms-win-crt-* DLLs before `main`; static, the
# release `--version` went from 6.88 to 6.43 ms (interleaved, 2x300 runs)
# and the binary no longer needs the VC++ redistributable. `cc` builds
# (bundled SQLite, ring) follow the same flag and compile with /MT.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
