[package]
name = "whycode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whycode"
path = "src/main.rs"

[features]
# Default ship: agent + TUI + upgrade + serve. Mermaid diagrams and the
# bat/two-face language pack stay opt-in (~1.7 MB) so Boot/TTFF stays low.
default = ["self-update", "server"]
# Everything including diagram render + extended syntax pack.
full = ["self-update", "server", "mermaid", "extended-syntax"]
# Unicode mermaid diagrams (mermaid-text + ascii_dag). Off by default — ~0.8 MB.
mermaid = ["whycode-format/mermaid", "whycode-tui/mermaid"]
# bat/two-face extended language pack (~0.9 MB). Off by default.
extended-syntax = ["whycode-format/extended-syntax", "whycode-tui/extended-syntax"]
# `whycode upgrade` — zip/tar extract + sha2 verify.
self-update = ["dep:sha2", "dep:flate2", "dep:tar", "dep:zip"]
# `whycode serve` — axum HTTP API.
server = ["dep:whycode-server", "dep:axum"]
# MiniLM ONNX embedder (downloads model on first use; larger binary / RSS).
onnx = ["whycode-memory/onnx", "whycode-tools/onnx", "whycode-agent/onnx"]

[dependencies]
whycode-core = { path = "../core" }
whycode-index = { path = "../index" }
whycode-auth = { path = "../auth" }
whycode-config = { path = "../config" }
whycode-llm = { path = "../llm" }
whycode-tools = { path = "../tools" }
whycode-skill = { path = "../skill" }
whycode-mcp = { path = "../mcp" }
whycode-session = { path = "../session" }
whycode-agent = { path = "../agent" }
whycode-storage = { path = "../storage" }
whycode-memory = { path = "../memory" }
whycode-server = { path = "../server", optional = true }
whycode-protocol = { path = "../protocol" }
whycode-tui = { path = "../tui" }
whycode-format = { path = "../format" }
clap = { workspace = true, features = ["derive"] }
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
colored.workspace = true
dialoguer = "0.11"
indicatif = "0.17"
axum = { version = "0.7", features = ["macros"], optional = true }
chrono.workspace = true
directories.workspace = true
reqwest.workspace = true
sha2 = { version = "0.10", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
