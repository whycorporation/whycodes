[package]
name = "whycode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whycode"
path = "src/main.rs"

[dependencies]
whycode-core = { path = "../core" }
whycode-llm = { path = "../llm" }
whycode-tools = { path = "../tools" }
whycode-session = { path = "../session" }
whycode-agent = { path = "../agent" }
whycode-storage = { path = "../storage" }
whycode-server = { path = "../server" }
whycode-protocol = { path = "../protocol" }
whycode-tui = { path = "../tui" }
clap = { workspace = true, features = ["derive"] }
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
colored.workspace = true
dialoguer = "0.11"
indicatif = "0.17"
axum = { version = "0.7", features = ["macros"] }
chrono.workspace = true
directories.workspace = true
reqwest.workspace = true
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
