[package]
name = "whycodes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "whycodes"
path = "src/main.rs"

[features]
# Default ship: agent + TUI + upgrade + serve (+ the Windows embedded shell).
# Mermaid diagrams and the bat/two-face language pack stay opt-in (~1.7 MB)
# so Boot/TTFF stays low.
default = ["self-update", "server", "embedded-shell"]
# Everything including diagram render + extended syntax pack.
full = ["self-update", "server", "embedded-shell", "mermaid", "extended-syntax", "ast-tools"]
# Windows only: `whycodes __shell -c`, a bash-compatible shell with bundled
# coreutils that the `bash` tool uses when no Git Bash is installed (before
# falling back to cmd.exe). Cargo has no per-target default features, so the
# feature is on everywhere but its crates are `cfg(windows)` dependencies:
# on Linux and macOS it links nothing and the binary does not change.
# `--no-default-features` (plus the others) opts a Windows build out.
embedded-shell = ["dep:whycodes-shell", "dep:whycodes-sandbox"]
# Unicode mermaid diagrams (mermaid-text + ascii_dag). Off by default — ~0.8 MB.
mermaid = ["whycodes-format/mermaid", "whycodes-tui/mermaid"]
# bat/two-face extended language pack (~0.9 MB). Off by default.
extended-syntax = ["whycodes-format/extended-syntax", "whycodes-tui/extended-syntax"]
# `whycodes upgrade` — zip/tar extract + sha2 verify.
self-update = ["dep:sha2", "dep:flate2", "dep:tar", "dep:zip"]
# `whycodes serve` — axum HTTP API.
server = ["dep:whycodes-server", "dep:axum"]
# MiniLM ONNX embedder (downloads model on first use; larger binary / RSS).
onnx = ["whycodes-memory/onnx", "whycodes-tools/onnx", "whycodes-agent/onnx"]
# Statically bundled SQLite (compile 200k LOC C). Off by default on Unix
# for fast dev builds (system sqlite via pkg-config). On Windows the
# storage crate always bundles — MSVC has no sqlite3.lib (LNK1181).
# Enable for fully static Linux release artifacts / CI without libsqlite3-dev.
bundled-sqlite = ["whycodes-storage/bundled"]
# `ast_grep` / `ast_edit` tools (tree-sitter grammars, ~5.2 MB). Off by default.
ast-tools = ["whycodes-tools/ast-tools"]

[dependencies]
whycodes-core = { path = "../core" }
whycodes-index = { path = "../index" }
whycodes-auth = { path = "../auth" }
whycodes-import = { path = "../import" }
whycodes-config = { path = "../config" }
whycodes-llm = { path = "../llm" }
whycodes-tools = { path = "../tools" }
whycodes-skill = { path = "../skill" }
whycodes-mcp = { path = "../mcp" }
whycodes-session = { path = "../session" }
whycodes-agent = { path = "../agent" }
whycodes-storage = { path = "../storage" }
whycodes-memory = { path = "../memory" }
whycodes-server = { path = "../server", optional = true }
whycodes-protocol = { path = "../protocol" }
whycodes-tui = { path = "../tui" }
whycodes-format = { path = "../format" }
whycodes-plugin = { path = "../plugin" }
whycodes-slop = { path = "../slop" }
clap = { workspace = true, features = ["derive", "string"] }
clap_complete.workspace = true
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
colored.workspace = true
dialoguer = "0.12"
indicatif = "0.18"
axum = { version = "0.8", features = ["macros"], optional = true }
chrono.workspace = true
directories.workspace = true
reqwest.workspace = true
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(windows)'.dependencies]
whycodes-shell = { path = "../shell", optional = true }
whycodes-sandbox = { path = "../sandbox", optional = true }

[dev-dependencies]
whycodes-sdk = { path = "../sdk" }
whycodes-storage = { path = "../storage", features = ["test-util"] }
tempfile.workspace = true

# Windows VERSIONINFO resource (build.rs, only when the target OS is windows).
# Unconditional so a non-Windows host cross-building for Windows still has it.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
