[package]
name = "whycodes-tools"
description = "Built-in tools for WhyCodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
onnx = ["whycodes-memory/onnx"]
bundled-sqlite = ["whycodes-memory/bundled-sqlite"]
# `ast_grep` / `ast_edit` structural search and rewrite. Off by default:
# the tree-sitter grammars (Rust, Python, Go, JavaScript, TypeScript, TSX)
# add ~5.2 MB to the release binary and ~50 s of C compilation cold.
ast-tools = [
    "dep:ast-grep-core",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
]

[dependencies]
whycodes-core = { path = "../core", version = "0.6" }
whycodes-index = { path = "../index", version = "0.6" }
whycodes-format = { path = "../format", version = "0.6" }
whycodes-skill = { path = "../skill", version = "0.6" }
whycodes-plugin = { path = "../plugin", version = "0.6" }
whycodes-lsp = { path = "../lsp", version = "0.6" }
whycodes-sandbox = { path = "../sandbox", version = "0.6" }
whycodes-memory = { path = "../memory", version = "0.6" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
thiserror.workspace = true
anyhow.workspace = true
glob.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
rayon.workspace = true
tracing.workspace = true
tempfile.workspace = true
reqwest.workspace = true
futures.workspace = true
base64.workspace = true
rustc-hash.workspace = true
ast-grep-core = { version = "0.51", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
