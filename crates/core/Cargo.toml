[package]
name = "whycodes-core"
description = "Shared leaf types, tool trait, errors, logging and paths for WhyCodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
whycodes-index = { path = "../index", version = "0.6" }
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# chrono's `Local` (the `clock` feature) is only used on Windows; on macOS it
# links CoreFoundation, which cost every process start ~0.9 ms (local_time.rs).
[target.'cfg(windows)'.dependencies]
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
