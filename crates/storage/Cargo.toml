[package]
name = "whycodes-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# System sqlite (pkg-config) is used by default for fast dev builds.
# CI/release enable `bundled` (`--features whycodes-storage/bundled` or
# `whycodes-cli/bundled-sqlite`) so machines without libsqlite3-dev still
# link. Compiling the amalgamation is ~43s cold, cached afterwards.
default = []
bundled = ["rusqlite/bundled"]

[dependencies]
whycodes-core = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
