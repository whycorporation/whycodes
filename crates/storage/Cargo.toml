[package]
name = "whycodes-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Unix: system sqlite (pkg-config) by default for fast dev builds.
# Windows: always bundled — MSVC has no sqlite3.lib unless the SDK is
# installed by hand (LNK1181). CI/release still pass `bundled` /
# `whycodes-cli/bundled-sqlite` so Linux runners without libsqlite3-dev
# link. Compiling the amalgamation is ~43s cold, cached afterwards.
default = []
bundled = ["rusqlite/bundled"]

[dependencies]
whycodes-core = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true

# Windows has no system sqlite3.lib on a typical MSVC install. Feature
# unification turns on rusqlite/bundled for this target only.
[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
