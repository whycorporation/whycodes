[package]
name = "whycodes-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol client for whycodes"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
futures.workspace = true
chrono.workspace = true
url = "2"
whycodes-auth = { path = "../auth", version = "0.6" }
whycodes-core = { path = "../core", version = "0.6" }
whycodes-tools = { path = "../tools", version = "0.6" }

# Job Object so a dropped stdio server takes its whole process tree along.
[target.'cfg(windows)'.dependencies]
whycodes-sandbox = { path = "../sandbox", version = "0.6" }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
async-stream = "0.3"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "test-util"] }
http-body-util = "0.1"
tempfile = { workspace = true }

[lints]
workspace = true
