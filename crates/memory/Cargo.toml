[package]
name = "whycode-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-session semantic / auto memory for whycode"

[features]
default = []
# MiniLM ONNX runtime (tract + tokenizers). Off by default for lean Boot/RSS.
onnx = ["dep:tract-onnx", "dep:tokenizers"]

[dependencies]
whycode-core = { path = "../core" }
whycode-index = { path = "../index" }
whycode-storage = { path = "../storage" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
tract-onnx = { version = "0.21", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = { workspace = true }
