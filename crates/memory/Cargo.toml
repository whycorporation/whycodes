[package]
name = "whycodes-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-session semantic / auto memory for whycodes"

[features]
default = []
# MiniLM ONNX runtime (tract + tokenizers). Off by default for lean Boot/RSS.
onnx = ["dep:tract-onnx", "dep:tokenizers"]
bundled-sqlite = ["whycodes-storage/bundled"]

[dependencies]
whycodes-core = { path = "../core", version = "0.6" }
whycodes-index = { path = "../index", version = "0.6" }
whycodes-storage = { path = "../storage", version = "0.6" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.11"
tract-onnx = { version = "0.23", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
