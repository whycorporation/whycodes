[package]
name = "whycodes-agent"
description = "Agent turn loop, tool scheduling, subagents and permission gates for WhyCodes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
onnx = ["whycodes-memory/onnx"]

[dependencies]
whycodes-core = { path = "../core", version = "0.6" }
whycodes-index = { path = "../index", version = "0.6" }
whycodes-config = { path = "../config", version = "0.6" }
whycodes-llm = { path = "../llm", version = "0.6" }
whycodes-tools = { path = "../tools", version = "0.6" }
whycodes-session = { path = "../session", version = "0.6" }
whycodes-mcp = { path = "../mcp", version = "0.6" }
whycodes-command-risk = { path = "../command-risk", version = "0.6" }
whycodes-sandbox = { path = "../sandbox", version = "0.6" }
whycodes-plugin = { path = "../plugin", version = "0.6" }
whycodes-memory = { path = "../memory", version = "0.6" }
whycodes-skill = { path = "../skill", version = "0.6" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
async-stream.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
