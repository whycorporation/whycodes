[package]
name = "whycode-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
whycode-core = { path = "../core" }
whycode-auth = { path = "../auth" }
whycode-config = { path = "../config" }
whycode-session = { path = "../session" }
whycode-agent = { path = "../agent" }
whycode-llm = { path = "../llm" }
whycode-tools = { path = "../tools" }
whycode-format = { path = "../format" }
whycode-storage = { path = "../storage" }
whycode-memory = { path = "../memory" }
unicode-width = "0.2"
base64.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
screenshot = []
# Forwarded from whycode-cli so a single feature set controls the whole binary.
mermaid = ["whycode-format/mermaid"]
extended-syntax = ["whycode-format/extended-syntax"]
