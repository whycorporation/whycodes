[package]
name = "whycodes-tui"
description = "Full-screen terminal UI for WhyCodes (ratatui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
whycodes-core = { path = "../core", version = "0.6" }
whycodes-auth = { path = "../auth", version = "0.6" }
whycodes-config = { path = "../config", version = "0.6" }
whycodes-session = { path = "../session", version = "0.6" }
whycodes-agent = { path = "../agent", version = "0.6" }
whycodes-llm = { path = "../llm", version = "0.6" }
whycodes-tools = { path = "../tools", version = "0.6" }
whycodes-format = { path = "../format", version = "0.6" }
whycodes-storage = { path = "../storage", version = "0.6" }
whycodes-memory = { path = "../memory", version = "0.6" }
whycodes-index = { path = "../index", version = "0.6" }
whycodes-import = { path = "../import", version = "0.6" }
whycodes-slop = { path = "../slop", version = "0.6" }
unicode-width = "0.2"
base64.workspace = true
regex.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
screenshot = []
# Forwarded from whycodes-cli so a single feature set controls the whole binary.
mermaid = ["whycodes-format/mermaid"]
extended-syntax = ["whycodes-format/extended-syntax"]

[lints]
workspace = true
