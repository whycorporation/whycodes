[package]
name = "whycodes-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
whycodes-core = { path = "../core" }
whycodes-auth = { path = "../auth" }
whycodes-config = { path = "../config" }
whycodes-session = { path = "../session" }
whycodes-agent = { path = "../agent" }
whycodes-llm = { path = "../llm" }
whycodes-tools = { path = "../tools" }
whycodes-format = { path = "../format" }
whycodes-storage = { path = "../storage" }
whycodes-memory = { path = "../memory" }
whycodes-index = { path = "../index" }
unicode-width = "0.2"
base64.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
screenshot = []
# Forwarded from whycodes-cli so a single feature set controls the whole binary.
mermaid = ["whycodes-format/mermaid"]
extended-syntax = ["whycodes-format/extended-syntax"]
