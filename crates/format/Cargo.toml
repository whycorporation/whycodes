[package]
name = "whycodes-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Unicode box-drawing for ```mermaid fences (~0.8 MB .text with ascii_dag).
# Off by default for Boot/TTFF binary size; enable via whycodes-cli `mermaid`.
mermaid = ["dep:mermaid-text"]
# bat/two-face ~250+ languages (~0.9 MB pack). Off by default; syntect defaults
# cover common languages. Enable via whycodes-cli `extended-syntax`.
extended-syntax = ["dep:two-face"]

[dependencies]
whycodes-core = { path = "../core" }
serde.workspace = true
rustc-hash.workspace = true
# TextMate highlighting on the Oniguruma regex engine (two-face matches it).
# fancy-regex compiled grammars cost ~90 MB RSS after 16 languages vs ~8 MB
# here, and the binary is smaller.
syntect = { version = "5", default-features = false, features = ["default-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"], optional = true }
regex = "1"
# Pure-Rust Mermaid → Unicode box-drawing for fenced ```mermaid blocks.
mermaid-text = { version = "0.57", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
